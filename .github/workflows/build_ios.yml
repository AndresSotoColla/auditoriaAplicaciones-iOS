name: Compilar iOS App (GitHub Actions)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar Proyecto Xcode y Generar IPA
    runs-on: macos-14

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Mostrar Versión de Xcode
        run: xcodebuild -version

      - name: Compilar Proyecto iOS
        run: |
          xcodebuild build \
            -project auditoriaAplicaciones.xcodeproj \
            -scheme auditoriaAplicaciones \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DerivedDataPath=build

      - name: Empaquetar Archivo .IPA y .APP
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "auditoriaAplicaciones.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "auditoriaAplicaciones.app" -type d | head -n 1)
          fi
          echo "Ruta de la app compilada: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/
            zip -r auditoriaAplicaciones.ipa Payload
            echo "IPA generado con éxito."
          else
            echo "Error: No se encontró el bundle .app compilado."
            exit 1
          fi

      - name: Subir Archivo IPA listo para Descargar
        uses: actions/upload-artifact@v4
        with:
          name: auditoriaAplicaciones-iOS-IPA
          path: auditoriaAplicaciones.ipa

      - name: Subir Bundle .APP de la Aplicación
        uses: actions/upload-artifact@v4
        with:
          name: auditoriaAplicaciones-iOS-APP-Bundle
          path: Payload/auditoriaAplicaciones.app
